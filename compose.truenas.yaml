# DBRepairs for TrueNAS SCALE 25.10
# Create these datasets first:
#   Apps/dbrepairs-postgres -> /mnt/Apps/dbrepairs-postgres
#   Apps/dbrepairs-backups  -> /mnt/Apps/dbrepairs-backups
# Replace the password below before installing.

x-db-password: &db-password "CHANGE-THIS-LONG-PASSWORD"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dbrepairs
      POSTGRES_USER: dbrepairs
      POSTGRES_PASSWORD: *db-password
      TZ: Europe/Lisbon
    volumes:
      - /mnt/Apps/dbrepairs-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbrepairs -d dbrepairs"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    image: ghcr.io/claudiodb007/dbrepairs-api:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: dbrepairs
      PGUSER: dbrepairs
      PGPASSWORD: *db-password
      DATABASE_POOL_SIZE: 10
      TZ: Europe/Lisbon
      TRUST_PROXY: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks: [internal]

  web:
    image: ghcr.io/claudiodb007/dbrepairs-web:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "31500:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: dbrepairs
      PGUSER: dbrepairs
      PGPASSWORD: *db-password
      BACKUP_INTERVAL_SECONDS: 86400
      BACKUP_RETENTION_DAYS: 14
      TZ: Europe/Lisbon
    volumes:
      - /mnt/Apps/dbrepairs-backups:/backups
    depends_on:
      api:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        while true; do
          stamp=$$(date +%Y%m%d-%H%M%S)
          temporary="/backups/DBRepairs-$${stamp}.dump.tmp"
          destination="/backups/DBRepairs-$${stamp}.dump"
          if pg_dump --format=custom --no-owner --no-privileges --file="$$temporary"; then
            mv "$$temporary" "$$destination"
            find /backups -type f -name 'DBRepairs-*.dump' -mtime "+$${BACKUP_RETENTION_DAYS}" -delete
          else
            rm -f "$$temporary"
          fi
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    networks: [internal]

networks:
  internal:
